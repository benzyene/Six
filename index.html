<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Our Escape Room 💕 *I Miss You Bharat* </title>
<link rel="preload" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=block" as="style" onload="this.rel='stylesheet'">
<noscript><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,600;1,600&display=block"></noscript>
<style>
:root{--pink:#f48fb1;--lilac:#ce93d8;--gold:#ffd700;}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
html,body{width:100%;height:100%;overflow:hidden;touch-action:manipulation;background:#000;}

/* ══ MUSIC NUDGE ══ */
#music-nudge{
  position:fixed;bottom:16px;left:50%;transform:translateX(-50%);
  background:rgba(20,0,40,0.85);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(255,160,220,0.4);border-radius:50px;
  padding:8px 22px;z-index:9999;pointer-events:none;
  font-family:'Cormorant Garamond',Georgia,serif;font-size:0.88rem;font-style:italic;
  color:rgba(255,220,245,0.9);letter-spacing:0.06em;
  opacity:0;transition:opacity 0.6s;
  white-space:nowrap;
}
#music-nudge.show{opacity:1;}

/* ══ INTRO SCREEN ══ */
#intro-screen{
  position:fixed;inset:0;z-index:500;
  background:linear-gradient(160deg,#f7c5d8 0%,#c9a0dc 40%,#6b2fa0 80%,#2a0a4a 100%);
  display:flex;align-items:center;justify-content:center;
  transition:opacity 1.8s ease;
}
#intro-screen.fade-out{opacity:0;pointer-events:none;}
#orb-canvas{position:absolute;inset:0;pointer-events:none;}
#stage-intro{
  display:flex;flex-direction:column;align-items:center;
  text-align:center;gap:clamp(10px,2.5vw,20px);
  position:relative;z-index:10;padding:0 clamp(16px,5vw,32px);
  padding-bottom:clamp(140px,28vh,200px);
  opacity:0;transition:opacity 1.4s ease;
}
#stage-intro.visible{opacity:1;}
#title{
  font-family:'Pinyon Script','Georgia',cursive;
  font-size:clamp(2.6rem,9vw,6rem);font-weight:900;color:#fff;
  text-shadow:0 0 14px #fff,0 0 35px rgba(255,180,220,1),0 0 70px rgba(240,100,180,0.9),0 0 120px rgba(200,60,160,0.7),0 4px 12px rgba(60,0,80,0.5);
  line-height:1.1;
}
#subtitle{
  font-family:'Cormorant Garamond','Georgia',serif;
  font-size:clamp(1rem,3.8vw,1.8rem);font-weight:600;font-style:italic;color:#fff;
  text-shadow:0 0 10px #fff,0 0 28px rgba(255,160,210,0.95),0 0 55px rgba(220,100,180,0.8);
  letter-spacing:0.05em;
}
#cta{
  margin-top:6px;padding:clamp(12px,3vw,15px) clamp(34px,8vw,52px);
  background:linear-gradient(135deg,#f48fb1,#ce93d8);
  border:none;border-radius:50px;
  font-family:'Cormorant Garamond','Georgia',serif;
  font-size:clamp(1rem,4vw,1.3rem);font-weight:700;color:#fff;letter-spacing:0.1em;
  cursor:pointer;
  box-shadow:0 0 20px rgba(220,100,180,0.7),0 0 50px rgba(200,80,150,0.3),0 4px 20px rgba(200,80,150,0.4);
  transition:transform 0.2s,box-shadow 0.2s;
  animation:cta-pulse 2.5s ease-in-out infinite alternate;
}
@keyframes cta-pulse{
  from{box-shadow:0 0 20px rgba(220,100,180,0.7),0 4px 20px rgba(200,80,150,0.4);}
  to{box-shadow:0 0 40px rgba(240,140,200,1),0 0 80px rgba(220,100,180,0.5),0 4px 20px rgba(200,80,150,0.4);}
}
#cta:active{transform:scale(0.96);animation:none;}
#chest-wrap{
  position:absolute;bottom:clamp(18px,4vh,44px);left:50%;transform:translateX(-50%);
  z-index:10;cursor:pointer;width:clamp(110px,20vw,160px);
}
#chest-wrap svg{overflow:visible;filter:drop-shadow(0 0 12px rgba(255,180,60,0.4));}
#lid{transform-origin:50% 100%;transform:rotate(0deg);transition:transform 0.95s cubic-bezier(0.3,0,0.2,1);}
#lid.open{transform:rotate(-115deg);}
#glow-overlay{
  position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(circle at 50% 86%,#fff8c0 0%,#ffe066 18%,#ffd700 35%,#ff9d00 55%,transparent 78%);
  opacity:0;
}
#spark-intro{position:absolute;inset:0;pointer-events:none;}

/* ══ ADVENTURE BRIDGE ══ */
#adventure-screen{
  position:fixed;inset:0;z-index:400;
  background:linear-gradient(160deg,#1a0030,#3d0060);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 1.2s ease;
  text-align:center;padding:20px;
}
#adventure-screen.show{opacity:1;pointer-events:all;}
#adv-title{
  font-family:'Pinyon Script','Georgia',cursive;
  font-size:clamp(2rem,8vw,4.2rem);color:#fff;
  text-shadow:0 0 30px rgba(255,200,230,0.9),0 0 70px rgba(220,100,200,0.5);
  margin-bottom:14px;
}
#adv-sub{
  font-family:'Cormorant Garamond',serif;font-size:clamp(0.95rem,3.5vw,1.4rem);
  font-style:italic;color:rgba(255,220,240,0.88);letter-spacing:0.07em;
}
#adv-stars{font-size:clamp(1.4rem,5vw,2rem);margin-top:20px;letter-spacing:0.3em;animation:adv-twinkle 1.5s ease-in-out infinite alternate;}
@keyframes adv-twinkle{from{opacity:0.5;transform:scale(0.95)}to{opacity:1;transform:scale(1.05)}}

/* ══ BALCONY SCREEN ══ */
#balcony-screen{
  position:fixed;inset:0;z-index:300;
  opacity:0;pointer-events:none;transition:opacity 2.2s ease;
}
#balcony-screen.show{opacity:1;pointer-events:all;}
#scene-canvas{position:absolute;inset:0;width:100%;height:100%;}
#spark-canvas{position:absolute;inset:0;pointer-events:none;z-index:10;}

/* ══ HUD ══ */
#hud{
  position:absolute;top:0;left:0;right:0;
  display:flex;flex-direction:column;align-items:center;gap:5px;
  padding:clamp(8px,2vw,14px) clamp(10px,3vw,16px);
  z-index:20;pointer-events:none;
}
#hint-banner{
  background:rgba(20,0,40,0.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border:1px solid rgba(255,160,220,0.45);border-radius:50px;
  padding:7px clamp(14px,4vw,26px);
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(0.75rem,2.8vw,1rem);font-style:italic;
  color:rgba(255,225,248,0.96);
  text-shadow:0 0 14px rgba(255,150,220,0.75);
  opacity:0;transition:opacity 0.8s;
  max-width:88vw;text-align:center;line-height:1.35;
}
#hint-banner.show{opacity:1;}
#stage-badge{
  background:rgba(20,0,40,0.78);border:1px solid rgba(255,200,100,0.45);
  border-radius:20px;padding:4px 14px;
  font-size:clamp(0.68rem,2.4vw,0.82rem);
  color:rgba(255,220,150,0.92);letter-spacing:0.07em;
}

/* ══ MODAL ══ */
#modal{
  position:fixed;inset:0;z-index:600;
  display:flex;align-items:center;justify-content:center;
  background:rgba(5,0,18,0.84);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  opacity:0;pointer-events:none;transition:opacity 0.45s;padding:16px;
}
#modal.show{opacity:1;pointer-events:all;}
#modal-box{
  background:linear-gradient(145deg,#1a003a,#2e0060);
  border:1.5px solid rgba(255,160,220,0.55);border-radius:22px;
  padding:clamp(20px,5vw,36px) clamp(18px,5vw,38px);
  width:100%;max-width:420px;text-align:center;
  box-shadow:0 0 60px rgba(200,80,255,0.28),0 0 120px rgba(255,100,200,0.1);
  max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;
}
.modal-title{
  font-family:'Pinyon Script',cursive;font-size:clamp(1.9rem,7vw,2.7rem);color:#fff;
  text-shadow:0 0 22px rgba(255,180,230,0.95);margin-bottom:12px;
}
.modal-body{
  font-size:clamp(0.88rem,3.4vw,1.05rem);font-style:italic;
  color:rgba(255,220,245,0.9);line-height:1.7;margin-bottom:18px;
}
.modal-input{
  width:100%;padding:11px 18px;
  background:rgba(255,255,255,0.07);
  border:1px solid rgba(255,160,220,0.4);border-radius:50px;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(0.92rem,3.4vw,1.08rem);
  color:#fff;text-align:center;outline:none;letter-spacing:0.06em;
  -webkit-appearance:none;transition:border-color 0.3s,box-shadow 0.3s;
}
.modal-input:focus{border-color:rgba(255,160,220,0.9);box-shadow:0 0 20px rgba(255,120,200,0.35);}
.modal-input.wrong{border-color:#ff6060;animation:shake 0.4s;}
.modal-input.right{border-color:#80ffc0;box-shadow:0 0 22px rgba(100,255,180,0.45);}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
.modal-btn{
  margin-top:14px;padding:11px clamp(26px,6vw,38px);
  background:linear-gradient(135deg,#f48fb1,#ce93d8);
  border:none;border-radius:50px;cursor:pointer;
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(0.92rem,3.4vw,1.08rem);font-weight:700;
  color:#fff;letter-spacing:0.08em;
  box-shadow:0 0 18px rgba(220,100,200,0.55);
  transition:transform 0.2s;-webkit-appearance:none;
}
.modal-btn:active{transform:scale(0.96);}
.modal-btn.finale-btn{
  background:linear-gradient(135deg,#ffd700,#ff9d00,#ff4081);
  font-size:clamp(1rem,3.8vw,1.2rem);padding:14px clamp(28px,7vw,44px);
  box-shadow:0 0 30px rgba(255,180,50,0.7),0 0 60px rgba(255,100,150,0.4);
  animation:finale-btn-pulse 1.8s ease-in-out infinite alternate;
}
@keyframes finale-btn-pulse{
  from{box-shadow:0 0 20px rgba(255,180,50,0.6);}
  to{box-shadow:0 0 50px rgba(255,180,50,1),0 0 80px rgba(255,100,150,0.6);}
}
.modal-row{display:flex;gap:10px;justify-content:center;}
.modal-row .modal-input{flex:1;}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin-top:10px;}
.cal-day{
  aspect-ratio:1;display:flex;align-items:center;justify-content:center;
  border-radius:6px;font-size:clamp(0.58rem,1.9vw,0.78rem);color:rgba(255,220,245,0.62);
}
.cal-day.target{
  background:linear-gradient(135deg,#f48fb1,#ce93d8);color:#fff;font-weight:700;border-radius:50%;
  box-shadow:0 0 16px rgba(255,120,200,0.85);animation:pcal 1s ease-in-out infinite alternate;
}
@keyframes pcal{from{box-shadow:0 0 8px rgba(255,120,200,0.45)}to{box-shadow:0 0 26px rgba(255,120,200,1)}}
#wheel-container{display:flex;flex-direction:column;align-items:center;gap:8px;}
#wheel-result{min-height:34px;font-style:italic;color:rgba(255,220,245,0.92);font-size:clamp(0.82rem,3vw,0.97rem);margin-top:6px;padding:0 8px;line-height:1.4;}

/* ══ FINALE ══ */
#finale{
  position:fixed;inset:0;z-index:700;
  background:radial-gradient(ellipse at center,#0e0028 0%,#000010 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  opacity:0;pointer-events:none;transition:opacity 1.6s;
  text-align:center;padding:clamp(16px,4vw,32px);
}
#finale.show{opacity:1;pointer-events:all;}
#finale-canvas{position:absolute;inset:0;pointer-events:none;}
#finale-title{
  font-family:'Pinyon Script',cursive;
  font-size:clamp(2.5rem,9vw,5.5rem);color:#fff;
  text-shadow:0 0 22px #fff,0 0 55px rgba(255,180,220,1),0 0 110px rgba(240,100,200,0.85);
  position:relative;z-index:1;
  animation:fglow 2.2s ease-in-out infinite alternate;line-height:1.1;
}
@keyframes fglow{
  from{text-shadow:0 0 22px #fff,0 0 55px rgba(255,180,220,1),0 0 90px rgba(240,100,200,0.65);}
  to{text-shadow:0 0 35px #fff,0 0 90px rgba(255,220,240,1),0 0 160px rgba(255,150,220,0.95);}
}
#finale-sub{
  font-family:'Cormorant Garamond',serif;
  font-size:clamp(0.95rem,3.5vw,1.55rem);font-style:italic;
  color:rgba(255,220,245,0.92);text-shadow:0 0 18px rgba(255,160,220,0.75);
  margin-top:14px;position:relative;z-index:1;line-height:1.65;
}
</style>
</head>
<body>

<!-- AUDIO — plays on first touch -->
<audio id="bgm" src="song.mp3" loop preload="auto"></audio>

<!-- music hint -->
<div id="music-nudge">♪ tap anywhere to begin the magic…</div>

<!-- ══ INTRO ══ -->
<div id="intro-screen">
  <canvas id="orb-canvas"></canvas>
  <div id="glow-overlay"></div>
  <canvas id="spark-intro"></canvas>
  <div id="stage-intro">
    <div id="title">Welcome to<br>Our Escape Room!</div>

    <button id="cta" onclick="openChest()">Let's Go!</button>
  </div>
  <div id="chest-wrap">
    <svg viewBox="0 0 160 110" width="100%" xmlns="http://www.w3.org/2000/svg">

      <rect x="12" y="62" width="136" height="8" fill="none" stroke="#6B3500" stroke-width="1" opacity="0.5"/>

      <rect x="12" y="94" width="136" height="8" fill="none" stroke="#6B3500" stroke-width="1" opacity="0.5"/>

        <path d="M17 50 Q80 19 143 50" fill="none" stroke="#C8860A" stroke-width="2.5"/>
        <circle cx="24" cy="52" r="3" fill="#DFA020" stroke="#A06800" stroke-width="1"/>

      </g>
      <rect x="69" y="45" width="22" height="17" rx="4" fill="#C8860A" stroke="#8B6000" stroke-width="1.5"/>

    Our escape room… complete.<br>
    Six clues. Six chapters. One love story — ours.<br><br>

<script>
// ═══════════════════════════════════════
// MUSIC — plays on first touch/click anywhere
// ═══════════════════════════════════════
const bgm = document.getElementById('bgm');
bgm.volume = 0.7;
let musicStarted = false;

function startMusic() {
  if (musicStarted) return;
  musicStarted = true;
  bgm.play().then(() => {
    // fade in from 0 to 0.7
    bgm.volume = 0;
    let v = 0;
    const fi = setInterval(() => {
      v = Math.min(v + 0.03, 0.7);
      bgm.volume = v;
      if (v >= 0.7) clearInterval(fi);
    }, 80);
  }).catch(() => {});
  document.getElementById('music-nudge').classList.remove('show');
}

// Show nudge after 1s, hide on first interaction
setTimeout(() => {
  if (!musicStarted) document.getElementById('music-nudge').classList.add('show');
}, 1000);

['touchstart','mousedown','click','keydown'].forEach(ev => {
  document.addEventListener(ev, startMusic, { once: true, passive: true });
});

// ═══════════════════════════════════════
// INTRO ORBS
// ═══════════════════════════════════════
const orbC = document.getElementById('orb-canvas');
const orbX = orbC.getContext('2d');
let OW, OH;
function resizeOrb() { OW = orbC.width = window.innerWidth; OH = orbC.height = window.innerHeight; }
resizeOrb();
const PAL = [{h:320,s:90,l:80},{h:280,s:80,l:85},{h:45,s:100,l:78},{h:340,s:85,l:88},{h:200,s:70,l:88},{h:60,s:80,l:85}];
const orbs = [];
for (let i = 0; i < 34; i++) orbs.push(newOrb(true));
function newOrb(init) {
  const col = PAL[Math.floor(Math.random() * PAL.length)];
  const zone = Math.floor(Math.random() * 4);
  let x, y;
  if (zone===0){x=Math.random()*OW*0.1;y=Math.random()*OH;}
  else if(zone===1){x=OW-Math.random()*OW*0.1;y=Math.random()*OH;}
  else if(zone===2){x=Math.random()*OW;y=Math.random()*OH*0.1;}
  else{x=Math.random()*OW;y=OH-Math.random()*OH*0.15;}
  return { x, y, h:col.h, s:col.s, l:col.l, r:Math.random()*14+6,
    vx:(Math.random()-0.5)*0.45, vy:-(Math.random()*0.42+0.1),
    pulse:Math.random()*Math.PI*2, pulseS:Math.random()*0.022+0.008,
    life:init?Math.random():1, decay:Math.random()*0.0016+0.0005,
    type:Math.random()<0.35?'fairy':Math.random()<0.5?'petal':'glow',
    angle:Math.random()*Math.PI*2 };
}
let orbT = 0;
function orbTick() {
  orbX.clearRect(0, 0, OW, OH); orbT++;
  orbs.forEach((o, i) => {
    o.x += o.vx; o.y += o.vy; o.life -= o.decay;
    if (o.life <= 0 || o.y < -30) { orbs[i] = newOrb(false); return; }
    const p = 0.65 + 0.35 * Math.sin(orbT * o.pulseS + o.pulse);
    const a = Math.max(0, o.life) * p;
    const r = o.r * (0.85 + 0.15 * p);
    orbX.save(); orbX.globalAlpha = a;
    if (o.type === 'glow') {
      const g = orbX.createRadialGradient(o.x,o.y,0,o.x,o.y,r*2.6);
      g.addColorStop(0, `hsla(${o.h},${o.s}%,${o.l}%,0.92)`);
      g.addColorStop(1, `hsla(${o.h},${o.s}%,${o.l}%,0)`);
      orbX.fillStyle = g; orbX.beginPath(); orbX.arc(o.x,o.y,r*2.6,0,Math.PI*2); orbX.fill();
      orbX.fillStyle = 'hsla(0,0%,98%,0.92)'; orbX.beginPath(); orbX.arc(o.x,o.y,r*0.33,0,Math.PI*2); orbX.fill();
    } else if (o.type === 'fairy') {
      orbX.fillStyle = `hsla(${o.h},${o.s}%,96%,0.96)`;
      orbX.beginPath(); orbX.arc(o.x,o.y,r*0.38,0,Math.PI*2); orbX.fill();
      orbX.strokeStyle = `hsla(${o.h},${o.s}%,92%,0.72)`; orbX.lineWidth = 0.9;
      const fl = r * 2.3;
      orbX.beginPath(); orbX.moveTo(o.x-fl,o.y); orbX.lineTo(o.x+fl,o.y); orbX.stroke();
      orbX.beginPath(); orbX.moveTo(o.x,o.y-fl); orbX.lineTo(o.x,o.y+fl); orbX.stroke();
    } else {
      orbX.save(); orbX.translate(o.x,o.y); orbX.rotate(o.angle + orbT*0.005);
      const pg = orbX.createRadialGradient(0,0,0,0,0,r*2.1);
      pg.addColorStop(0, `hsla(${o.h},${o.s}%,${o.l}%,0.88)`);
      pg.addColorStop(1, `hsla(${o.h},${o.s}%,${o.l}%,0)`);
      orbX.fillStyle = pg; orbX.scale(1, 1.85);
      orbX.beginPath(); orbX.arc(0,0,r*1.65,0,Math.PI*2); orbX.fill();
      orbX.restore();
    }
    orbX.restore();
  });
  requestAnimationFrame(orbTick);
}

const spkI = document.getElementById('spark-intro');

function resizeSpkI() { SI_W = spkI.width = window.innerWidth; SI_H = spkI.height = window.innerHeight; }

function spkITick() {
  spkIX.clearRect(0,0,SI_W,SI_H);
  introSparks = introSparks.filter(s => s.life > 0);
  introSparks.forEach(s => {
    s.x += s.vx; s.y += s.vy; s.vy += 0.09; s.life -= s.decay;
    spkIX.save(); spkIX.globalAlpha = Math.max(0, s.life);
    spkIX.translate(s.x, s.y); spkIX.fillStyle = s.col;
    if (s.star) {
      spkIX.beginPath();
      for (let i=0;i<5;i++){const a=(i*2*Math.PI/5)-Math.PI/2,b=a+Math.PI/5;
        spkIX.lineTo(Math.cos(a)*s.r,Math.sin(a)*s.r);
        spkIX.lineTo(Math.cos(b)*s.r*0.4,Math.sin(b)*s.r*0.4);}
      spkIX.closePath(); spkIX.fill();
    } else { spkIX.beginPath(); spkIX.arc(0,0,s.r,0,Math.PI*2); spkIX.fill(); }
    spkIX.restore();
  });
  requestAnimationFrame(spkITick);
}
spkITick();
function burstIntro(x, y, n) {
  const cols = ['#ffe080','#ffd700','#fff','#ffcc44','#ff88aa','#cc88ff','#88eeff'];
  for (let i=0;i<n;i++) {
    const ang = Math.random()*Math.PI*2, spd = Math.random()*7+2;
    introSparks.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-3,
      life:1,decay:Math.random()*0.018+0.008,r:Math.random()*5.5+2,
      col:cols[Math.floor(Math.random()*cols.length)],star:Math.random()<0.42});
  }
}

function tickActions() {
  animT++; cbTimer++; kgTimer++;
  // catboy cycle: idle120 → drink40 → idle70 → smoke40 → repeat
  if(cbAction===IDLE && cbTimer>120){cbAction=DRINK;cbTimer=0;}
  else if(cbAction===DRINK && cbTimer>42){cbAction=IDLE;cbTimer=0;}
  else if(cbAction===IDLE && cbTimer>70){cbAction=SMOKE;cbTimer=0;}
  else if(cbAction===SMOKE && cbTimer>42){cbAction=IDLE;cbTimer=0;}
  // kitty: offset
  if(kgAction===IDLE && kgTimer>95){kgAction=SMOKE;kgTimer=0;}
  else if(kgAction===SMOKE && kgTimer>42){kgAction=IDLE;kgTimer=0;}
  else if(kgAction===IDLE && kgTimer>115){kgAction=DRINK;kgTimer=0;}
  else if(kgAction===DRINK && kgTimer>42){kgAction=IDLE;kgTimer=0;}
  // shooting stars
  nextShoot--;
  if (nextShoot <= 0) {
    shootingStars.push({
      x: Math.random()*SW*0.7, y: Math.random()*SH*0.22,
      vx: (3+Math.random()*4), vy: (1+Math.random()*2),
      life: 1, len: 40+Math.random()*60
    });
    nextShoot = 200 + Math.random()*300;
  }
  shootingStars.forEach((s,i)=>{ s.x+=s.vx; s.y+=s.vy; s.life-=0.03; if(s.life<=0)shootingStars.splice(i,1); });
}

function balconyLoop() { tickActions(); fairyT++; drawBalcony(); requestAnimationFrame(balconyLoop); }

// ── SKY ──
function drawSky() {
  const g = sx.createLinearGradient(0,0,0,SH*0.62);
  g.addColorStop(0,'#010009'); g.addColorStop(0.3,'#07001e'); g.addColorStop(1,'#110032');
  sx.fillStyle=g; sx.fillRect(0,0,SW,SH*0.62);
  // stars
  sx.save();
  for(let i=0;i<120;i++){
    const stx=(i*137.5%100)/100*SW, sty=(i*97.3%55)/100*SH*0.5;
    const br=0.28+0.72*Math.sin(fairyT*0.026+i*0.72);
    sx.globalAlpha=br*0.88; sx.fillStyle='#fff';
    sx.beginPath(); sx.arc(stx,sty,0.65+Math.sin(fairyT*0.032+i)*0.28,0,Math.PI*2); sx.fill();
  }
  // shooting stars
  shootingStars.forEach(s => {
    sx.save(); sx.globalAlpha = s.life * 0.9;
    const grad = sx.createLinearGradient(s.x,s.y,s.x-s.vx*s.len/5,s.y-s.vy*s.len/5);
    grad.addColorStop(0,'rgba(255,255,220,0.95)'); grad.addColorStop(1,'rgba(255,255,220,0)');
    sx.strokeStyle=grad; sx.lineWidth=1.8; sx.lineCap='round';
    sx.beginPath(); sx.moveTo(s.x,s.y); sx.lineTo(s.x-s.vx*s.len/5,s.y-s.vy*s.len/5); sx.stroke();
    sx.restore();
  });
  sx.restore();
  // moon with gentle halo rings
  const mx=SW*0.82, my=SH*0.10;
  for(let ring=0;ring<3;ring++){
    const pr=0.3+0.2*Math.sin(fairyT*0.01+ring);
    const mg2=sx.createRadialGradient(mx,my,0,mx,my,55+ring*22);
    mg2.addColorStop(0,'rgba(0,0,0,0)');
    mg2.addColorStop(0.7,'rgba(0,0,0,0)');
    mg2.addColorStop(0.85,`rgba(255,220,140,${pr*0.12})`);
    mg2.addColorStop(1,'rgba(0,0,0,0)');
    sx.fillStyle=mg2; sx.beginPath(); sx.arc(mx,my,55+ring*22,0,Math.PI*2); sx.fill();
  }
  const mg=sx.createRadialGradient(mx,my,0,mx,my,50);
  mg.addColorStop(0,'rgba(255,248,220,0.97)'); mg.addColorStop(0.55,'rgba(255,230,160,0.65)'); mg.addColorStop(1,'rgba(255,200,100,0)');
  sx.fillStyle=mg; sx.beginPath(); sx.arc(mx,my,50,0,Math.PI*2); sx.fill();
  sx.fillStyle='rgba(255,248,212,0.93)'; sx.beginPath(); sx.arc(mx,my,23,0,Math.PI*2); sx.fill();
}

// ── LAYOUT ──
function getLayout(){
  // characters face each other across the table
  const tableX=SW*0.50, tableY=SH*0.70;
  const tableW=SW*0.14, tableH=SH*0.055;
  const catH=Math.min(SH*0.28, SW*0.22);
  const cbX=tableX-tableW*2.2, kgX=tableX+tableW*2.2;
  const charY=tableY-catH*0.58;
  return {tableX,tableY,tableW,tableH,cbX,kgX,charY,catH};
}

// ── TABLE ──
function drawTable(){
  const {tableX,tableY,tableW,tableH}=getLayout();
  sx.save();
  // shadow
  sx.fillStyle='rgba(0,0,0,0.32)';
  sx.beginPath(); sx.ellipse(tableX,tableY+tableH+10,tableW*0.85,tableH*0.22,0,0,Math.PI*2); sx.fill();
  // tabletop with dark wood grain
  const tg=sx.createLinearGradient(tableX-tableW,tableY,tableX+tableW,tableY+tableH);
  tg.addColorStop(0,'#301a62'); tg.addColorStop(0.5,'#1e0e40'); tg.addColorStop(1,'#160a32');
  sx.fillStyle=tg;
  sx.beginPath(); sx.roundRect(tableX-tableW,tableY,tableW*2,tableH,10); sx.fill();
  // edge highlight
  sx.strokeStyle='rgba(180,130,255,0.35)'; sx.lineWidth=1;
  sx.beginPath(); sx.roundRect(tableX-tableW,tableY,tableW*2,tableH,10); sx.stroke();
  // table legs
  sx.strokeStyle='rgba(120,75,190,0.55)'; sx.lineWidth=4; sx.lineCap='round';
  sx.beginPath(); sx.moveTo(tableX-tableW*0.72,tableY+tableH); sx.lineTo(tableX-tableW*0.72,tableY+tableH+SH*0.07); sx.stroke();
  sx.beginPath(); sx.moveTo(tableX+tableW*0.72,tableY+tableH); sx.lineTo(tableX+tableW*0.72,tableY+tableH+SH*0.07); sx.stroke();
  const topY=tableY-2;
  // candle in center for ambience
  drawCandle(tableX, topY);
  // wine glasses — left and right of candle
  drawWineGlass(tableX-tableW*0.62, topY-SH*0.07);
  drawWineGlass(tableX+tableW*0.62, topY-SH*0.07);
  // popcorn box — left side
  drawPopcorn(tableX-tableW*0.22, topY-SH*0.032);
  // cig pack — right side
  drawCigPack(tableX+tableW*0.28, topY-SH*0.018);
  sx.restore();
}

function drawCandle(cx,cy){
  sx.save();
  // glow
  const fr2=0.5+0.5*Math.sin(fairyT*0.07);
  const cg=sx.createRadialGradient(cx,cy-18,0,cx,cy-18,28+fr2*6);
  cg.addColorStop(0,`rgba(255,200,80,${0.25+fr2*0.15})`);
  cg.addColorStop(1,'rgba(255,200,80,0)');
  sx.fillStyle=cg; sx.beginPath(); sx.arc(cx,cy-18,28+fr2*6,0,Math.PI*2); sx.fill();
  // body
  sx.fillStyle='rgba(255,250,240,0.92)';
  sx.beginPath(); sx.roundRect(cx-4,cy-30,8,20,3); sx.fill();
  // wax drip
  sx.fillStyle='rgba(255,240,220,0.7)';
  sx.beginPath(); sx.ellipse(cx,cy-10,5,3,0,0,Math.PI*2); sx.fill();

  flg.addColorStop(0,'rgba(255,240,150,1)'); flg.addColorStop(0.4,'rgba(255,160,60,0.9)'); flg.addColorStop(1,'rgba(255,80,0,0)');
  sx.fillStyle=flg;
  sx.beginPath(); sx.ellipse(cx,cy-30-fh*0.3,3.5,fh,0,0,Math.PI*2); sx.fill();

}

function drawWineGlass(gx,gy){
  sx.save();
  const h=SH*0.075;
  // wine (pale gold = white wine)
  sx.fillStyle='rgba(240,222,140,0.42)';
  sx.beginPath(); sx.moveTo(gx-7,gy+2); sx.lineTo(gx-9,gy+h*0.44); sx.lineTo(gx+9,gy+h*0.44); sx.lineTo(gx+7,gy+2); sx.closePath(); sx.fill();
  // glass outline
  sx.strokeStyle='rgba(215,245,255,0.78)'; sx.lineWidth=1.4;
  sx.beginPath(); sx.moveTo(gx-8,gy); sx.lineTo(gx-10,gy+h*0.45); sx.lineTo(gx+10,gy+h*0.45); sx.lineTo(gx+8,gy); sx.closePath(); sx.stroke();
  sx.beginPath(); sx.moveTo(gx,gy+h*0.45); sx.lineTo(gx,gy+h*0.84); sx.stroke();
  sx.beginPath(); sx.moveTo(gx-8,gy+h*0.84); sx.lineTo(gx+8,gy+h*0.84); sx.stroke();
  // shine
  sx.strokeStyle='rgba(255,255,255,0.48)'; sx.lineWidth=1;
  sx.beginPath(); sx.moveTo(gx-4,gy+3); sx.lineTo(gx-5,gy+h*0.3); sx.stroke();

  const cflicker=0.5+0.5*Math.sin(fairyT*0.07);
  sx.fillStyle=`rgba(255,220,100,${cflicker*0.12})`;
  sx.beginPath(); sx.moveTo(gx-8,gy); sx.lineTo(gx-10,gy+h*0.45); sx.lineTo(gx+10,gy+h*0.45); sx.lineTo(gx+8,gy); sx.closePath(); sx.fill();
  sx.restore();
}

function drawPopcorn(px,py){
  sx.save();
  if(stage>=1&&stage<3){
    const gp=sx.createRadialGradient(px,py-14,0,px,py-14,34);
    gp.addColorStop(0,'rgba(255,240,100,0.42)'); gp.addColorStop(1,'rgba(255,240,100,0)');
    sx.fillStyle=gp; sx.beginPath(); sx.arc(px,py-14,34,0,Math.PI*2); sx.fill();
  }
  sx.fillStyle='#e03030'; sx.strokeStyle='#ff5050'; sx.lineWidth=1;
  sx.beginPath(); sx.moveTo(px-12,py-2); sx.lineTo(px-9,py+20); sx.lineTo(px+9,py+20); sx.lineTo(px+12,py-2); sx.closePath(); sx.fill(); sx.stroke();
  sx.fillStyle='rgba(255,255,255,0.28)';
  sx.beginPath(); sx.moveTo(px-2,py-2); sx.lineTo(px-1,py+20); sx.lineTo(px+3,py+20); sx.lineTo(px+4,py-2); sx.closePath(); sx.fill();
  const puffs=[[-8,-16],[0,-19],[8,-16],[-5,-10],[4,-11],[0,-9],[-9,-10],[9,-11],[2,-20]];
  const pcols=['#ffe060','#ffb820','#ffc840','#ffe880','#ffcc40'];
  puffs.forEach(([dx,dy],ii)=>{
    sx.fillStyle=pcols[ii%pcols.length];
    sx.beginPath(); sx.arc(px+dx,py+dy,4,0,Math.PI*2); sx.fill();
    sx.fillStyle='rgba(255,255,200,0.5)';
    sx.beginPath(); sx.arc(px+dx-1,py+dy-1,1.5,0,Math.PI*2); sx.fill();
  });
  sx.restore();
}

function drawCigPack(cx,cy){

function drawKGArm(x,y,catH,hw,action){
  sx.save();
  sx.strokeStyle='#f48fb1'; sx.lineCap='round'; sx.lineWidth=hw*0.25;
  const shX=x-hw*0.40, shY=y+catH*0.44;

    const elX=shX-hw*0.52, elY=shY-catH*0.15, haX=elX-hw*0.28, haY=elY-catH*0.09;
    sx.beginPath(); sx.moveTo(shX,shY); sx.lineTo(elX,elY); sx.lineTo(haX,haY); sx.stroke();
    drawMiniGlass(haX-5,haY-9);
  } else if(action===SMOKE){
    const elX=shX-hw*0.48, elY=shY-catH*0.12, haX=elX-hw*0.24, haY=elY-catH*0.08;
    sx.beginPath(); sx.moveTo(shX,shY); sx.lineTo(elX,elY); sx.lineTo(haX,haY); sx.stroke();
    drawCig(haX,haY,-1);
  } else {
    sx.beginPath(); sx.moveTo(shX,shY); sx.lineTo(shX-hw*0.56,shY+catH*0.05); sx.stroke();
  }
  sx.restore();
}

function drawBow(bx,by,hw){
  sx.save();
  const bs=hw*0.28;
  sx.fillStyle='#ff4081';
  sx.beginPath(); sx.ellipse(bx-bs*0.55,by,bs*0.6,bs*0.38,0.3,0,Math.PI*2); sx.fill();
  sx.beginPath(); sx.ellipse(bx+bs*0.55,by,bs*0.6,bs*0.38,-0.3,0,Math.PI*2); sx.fill();
  sx.fillStyle='#ff70a8'; sx.beginPath(); sx.ellipse(bx,by,bs*0.3,bs*0.3,0,0,Math.PI*2); sx.fill();
  sx.restore();
}

function drawMiniGlass(gx,gy){
  sx.save();
  sx.fillStyle='rgba(240,222,140,0.48)';
  sx.beginPath(); sx.moveTo(gx-4,gy+1); sx.lineTo(gx-5,gy+9); sx.lineTo(gx+5,gy+9); sx.lineTo(gx+4,gy+1); sx.closePath(); sx.fill();
  sx.strokeStyle='rgba(210,245,255,0.82)'; sx.lineWidth=1.3;
  sx.beginPath(); sx.moveTo(gx-4,gy); sx.lineTo(gx-5,gy+9); sx.lineTo(gx+5,gy+9); sx.lineTo(gx+4,gy); sx.closePath(); sx.stroke();
  sx.beginPath(); sx.moveTo(gx,gy+9); sx.lineTo(gx,gy+15); sx.stroke();
  sx.beginPath(); sx.moveTo(gx-4,gy+15); sx.lineTo(gx+4,gy+15); sx.stroke();
  sx.restore();
}

function drawCig(cx,cy,dir){
  sx.save();
  sx.strokeStyle='rgba(225,215,185,0.88)'; sx.lineWidth=2.8; sx.lineCap='round';
  sx.beginPath(); sx.moveTo(cx,cy-2); sx.lineTo(cx+16*dir,cy-7); sx.stroke();
  sx.strokeStyle='#ff7744'; sx.lineWidth=2.2;
  sx.beginPath(); sx.moveTo(cx+16*dir,cy-7); sx.lineTo(cx+19*dir,cy-8); sx.stroke();
  // filter tip
  sx.strokeStyle='rgba(230,160,100,0.8)'; sx.lineWidth=2.8;
  sx.beginPath(); sx.moveTo(cx+16*dir,cy-7); sx.lineTo(cx+22*dir,cy-9); sx.stroke();
  sx.restore();
}

function drawSmoke(sx2,sy2,dir){
  for(let i=0;i<4;i++){
    const age=(fairyT+i*18)%72;
    const a=Math.max(0,1-age/72)*0.4;
    const rise=age*0.75, drift=Math.sin(age*0.16+i)*9*dir;
    const r=4+age*0.2;
    sx.save(); sx.globalAlpha=a;
    sx.fillStyle=`rgba(${190+i*10},${190+i*8},${200+i*5},0.65)`;
    sx.beginPath(); sx.arc(sx2+drift,sy2-rise,r,0,Math.PI*2); sx.fill();
    sx.restore();
  }
}

  gift:   { emoji:'🎁', xf:()=>SW*0.86,        yf:()=>SH*0.73,               r:24, active:()=>stage===5, glow:'#ff88cc' },

};

function drawObjects(){
  Object.values(OBJECTS).forEach(obj=>{
    if(!obj.active()) return;
    const ox=obj.xf(), oy=obj.yf();
    const pulse=0.52+0.48*Math.sin(fairyT*0.09);
    const gg=sx.createRadialGradient(ox,oy,0,ox,oy,obj.r*3);
    gg.addColorStop(0,obj.glow+'88'); gg.addColorStop(1,obj.glow+'00');
    sx.fillStyle=gg; sx.globalAlpha=pulse;
    sx.beginPath(); sx.arc(ox,oy,obj.r*3,0,Math.PI*2); sx.fill();
    sx.globalAlpha=1;
    const fs=Math.max(18, Math.min(obj.r*1.7, 32));
    sx.font=`${fs}px serif`; sx.textAlign='center'; sx.textBaseline='middle';
    sx.fillText(obj.emoji,ox,oy);
    sx.strokeStyle=obj.glow; sx.lineWidth=2; sx.globalAlpha=pulse*0.65;
    sx.beginPath(); sx.arc(ox,oy,obj.r*1.55,0,Math.PI*2); sx.stroke();
    sx.globalAlpha=1;
  });
}

// BALCONY SPARKS
// ═══════════════════════════════════════
let spkC2, spkX2, spkW2, spkH2, sparks = [];
function spkLoop(){
  if(!spkC2) return;
  spkX2.clearRect(0,0,spkW2,spkH2);
  sparks = sparks.filter(s=>s.life>0);
  sparks.forEach(s=>{
    s.x+=s.vx; s.y+=s.vy; s.vy+=0.09; s.vx*=0.99; s.life-=s.decay;
    spkX2.save(); spkX2.globalAlpha=Math.max(0,s.life);
    spkX2.translate(s.x,s.y); spkX2.fillStyle=s.col;
    if(s.star){
      spkX2.beginPath();
      for(let i=0;i<5;i++){const a=(i*2*Math.PI/5)-Math.PI/2,b=a+Math.PI/5;
        spkX2.lineTo(Math.cos(a)*s.r,Math.sin(a)*s.r);
        spkX2.lineTo(Math.cos(b)*s.r*0.4,Math.sin(b)*s.r*0.4);}
      spkX2.closePath(); spkX2.fill();
    } else { spkX2.beginPath(); spkX2.arc(0,0,s.r,0,Math.PI*2); spkX2.fill(); }
    spkX2.restore();
  });
  requestAnimationFrame(spkLoop);
}
function burst(x,y,n,cols){
  for(let i=0;i<n;i++){
    const ang=Math.random()*Math.PI*2, spd=Math.random()*6.5+2;
    sparks.push({x,y,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd-3,
      life:1,decay:Math.random()*0.018+0.007,r:Math.random()*5.5+2,
      col:cols[Math.floor(Math.random()*cols.length)],star:Math.random()<0.45});
  }
}

function handleSceneClick(e){
  startMusic();
  const rect=sc.getBoundingClientRect();
  const mx=(e.clientX-rect.left)*(SW/rect.width);
  const my=(e.clientY-rect.top)*(SH/rect.height);
  Object.entries(OBJECTS).forEach(([key,obj])=>{
    if(!obj.active()) return;
    const dx=mx-obj.xf(), dy=my-obj.yf();
    if(Math.sqrt(dx*dx+dy*dy)<obj.r*2.8) openModal(key);
  });
}

const modal=document.getElementById('modal');

function openModal(key){
  mCont.innerHTML='';

  modal.classList.add('show');
}
function closeModal(){ modal.classList.remove('show'); }
modal.addEventListener('click',e=>{ if(e.target===modal) closeModal(); });

function btn(label,fn,cls){
  const b=document.createElement('button');
  b.className='modal-btn'+(cls?' '+cls:'');
  b.textContent=label; b.onclick=fn; return b;
}
function inp(id,ph){
  const i=document.createElement('input');
  i.className='modal-input'; i.id=id; i.placeholder=ph;
  i.autocomplete='off'; i.autocorrect='off'; i.spellcheck=false; return i;
}
function wrong(el){ el.classList.add('wrong'); setTimeout(()=>el.classList.remove('wrong'),520); }

  const i=inp('lock-ans','Your answer…');

// ── CALENDAR ──
function showCal(){
  mTitle.textContent='📅 Our Date';
  mBody.textContent='Enter the month and day our story officially began ♡';
  const row=document.createElement('div'); row.className='modal-row';
  const im=inp('cal-m','Month (e.g. March)');
  const id2=inp('cal-d','Day (e.g. 31)');
  row.append(im,id2);
  const calDiv=document.createElement('div'); calDiv.id='cal-disp';
  mCont.append(row, calDiv, btn('Open the Calendar 💛',()=>{
    const mv=im.value.trim().toLowerCase(), dv=parseInt(id2.value.trim());
    if(mv.includes('dec')&&dv===8){
      showMiniCal(calDiv,12,8); // Dec 8
      burst(OBJECTS.cal.xf(),OBJECTS.cal.yf(),75,['#80c8ff','#fff','#ffd700','#aaddff','#ffaacc','#ccddff']);
      setTimeout(()=>{ closeModal(); stage=4; setBadge('Stage 4 / 6'); setHint('🎡 Spin to see what fate holds for us…'); },1600);
    } else { wrong(im); wrong(id2); }
  }));
}
function showMiniCal(div,month,targetDay){
  const names=['','Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  // Dec 2024 starts on Sunday (0)
  const firstDay=0, daysInMonth=31;
  let h=`<div style="font-size:0.82rem;color:rgba(255,200,240,0.72);margin:10px 0 4px;letter-spacing:0.06em;">${names[month]}</div>`;
  h+=`<div class="cal-grid">`;
  ['Su','Mo','Tu','We','Th','Fr','Sa'].forEach(d=>{ h+=`<div class="cal-day" style="color:rgba(255,180,220,0.55);font-weight:600;font-size:0.62rem;">${d}</div>`; });
  for(let i=0;i<firstDay;i++) h+=`<div class="cal-day"></div>`;
  for(let d=1;d<=daysInMonth;d++) h+=`<div class="cal-day${d===targetDay?' target':''}">${d}</div>`;
  h+=`</div>`;
  div.innerHTML=h;
}

// ── WHEEL ──
const WHEEL_MSGS=['Our favourite adventure 🌙','Forever isn\'t long enough 💕','Our ordinary is magical ✨','Our hearts chose each other 🌸','Home is wherever we are 🏡','Every moment is our gift 🎁'];
const WHEEL_COLS=['#f48fb1','#ce93d8','#80deea','#ffcc80','#c5e1a5','#ef9a9a'];
let wheelSpun=false;

function showWheel(){
  mTitle.textContent='💘 Cupid\'s Arrow';
  mBody.textContent='Let Cupid decide what the universe says about us…';
  wheelSpun=false;
  const N=WHEEL_MSGS.length;
  const size=Math.min(195,window.innerWidth*0.5);
  const r2=size/2-5;
  const slices=WHEEL_MSGS.map((msg,i)=>{
    const a0=(i/N)*Math.PI*2-Math.PI/2, a1=((i+1)/N)*Math.PI*2-Math.PI/2;
    const x0=Math.cos(a0)*r2,y0=Math.sin(a0)*r2,x1=Math.cos(a1)*r2,y1=Math.sin(a1)*r2;
    const mx2=Math.cos((a0+a1)/2)*r2*0.64, my2=Math.sin((a0+a1)/2)*r2*0.64;
    return `<path d="M0 0 L${x0} ${y0} A${r2} ${r2} 0 0 1 ${x1} ${y1}Z" fill="${WHEEL_COLS[i]}" stroke="rgba(255,255,255,0.22)" stroke-width="1.5"/>
    <text x="${mx2}" y="${my2}" text-anchor="middle" dominant-baseline="middle" font-size="14" fill="rgba(255,255,255,0.95)">
      ${ ['🌙','💕','✨','🌸','🏡','🎁'][i] }
    </text>`;
  }).join('');
  mCont.innerHTML=`<div id="wheel-container">
    <div style="font-size:1.9rem;line-height:1;margin-bottom:-2px;filter:drop-shadow(0 0 8px #ff4081);">💘</div>
    <svg id="wheel-svg" width="${size}" height="${size}" viewBox="${-size/2} ${-size/2} ${size} ${size}"
         style="display:block;transition:transform 3.9s cubic-bezier(0.17,0.67,0.1,1);">
      ${slices}
      <circle cx="0" cy="0" r="${size*0.085}" fill="rgba(255,255,255,0.15)" stroke="rgba(255,255,255,0.45)" stroke-width="2"/>
      <text x="0" y="2" text-anchor="middle" dominant-baseline="middle" font-size="${size*0.08}" fill="white">💫</text>
    </svg>
    <div id="wheel-result" style="min-height:34px;font-style:italic;color:rgba(255,220,245,0.94);font-size:clamp(0.82rem,3vw,0.97rem);margin-top:6px;padding:0 8px;line-height:1.4;"></div>
  </div>`;
  mCont.appendChild(btn('Spin! 🌀',()=>{
    if(wheelSpun) return; wheelSpun=true;
    const pick=Math.floor(Math.random()*N);
    const deg=(5+Math.random()*3)*360+(pick/N)*360;
    document.getElementById('wheel-svg').style.transform=`rotate(${deg}deg)`;
    burst(window.innerWidth/2,window.innerHeight/2,95,['#f48fb1','#ce93d8','#ffd700','#80deea','#fff','#ffaacc','#ffccff']);
    setTimeout(()=>{
      document.getElementById('wheel-result').textContent=`"${WHEEL_MSGS[pick]}"`;
      burst(window.innerWidth/2,window.innerHeight/2,65,['#ffd700','#fff','#ffaacc','#cc88ff']);
      setTimeout(()=>{ closeModal(); stage=5; setBadge('Stage 5 / 6'); setHint('🎁 A gift is waiting on the balcony… just for us.'); },1100);
    },4100);
  }));
}

// ── GIFT ──
function showGift(){
  mTitle.textContent='🎁 Our Gift';
  mBody.textContent='Something precious is hidden inside… tap to open 💝';
  const anim=document.createElement('div');
  anim.style.cssText='font-size:clamp(3rem,10vw,4.5rem);cursor:pointer;display:inline-block;transition:transform 0.35s;';
  anim.textContent='🎁';
  const rev=document.createElement('div'); rev.style.cssText='min-height:50px;margin-top:12px;';
  let opened=false;
  anim.onclick=()=>{
    if(opened) return; opened=true;
    anim.style.transform='scale(1.35) rotate(12deg)';
    burst(OBJECTS.gift.xf(),OBJECTS.gift.yf(),95,['#ff88cc','#ffd700','#ffaaff','#fff','#ff6699','#ffccee']);
    setTimeout(()=>{
      anim.textContent='💝'; anim.style.transform='scale(1.05)';
      rev.innerHTML=`<div style="font-size:clamp(0.86rem,3vw,1rem);font-style:italic;color:rgba(255,220,245,0.94);line-height:1.85;margin-bottom:14px;">
        Every single day together is our favourite gift.<br>
        <span style="font-size:clamp(1.5rem,5.5vw,2.2rem);">🌹 💍 🥂</span>
      </div>`;
      rev.appendChild(btn('Continue… 📜',()=>{ closeModal(); stage=6; setBadge('Stage 6 / 6'); setHint('📜 One last secret… unroll the scroll on our table.'); }));
    },650);
  };
  mCont.append(anim,rev);
}

function setHint(text){
  const h=document.getElementById('hint-banner');
  h.classList.remove('show');
  setTimeout(()=>{ h.textContent=text; h.classList.add('show'); },360);
}

// FINALE
// ═══════════════════════════════════════
function startFinale(){
  document.getElementById('finale').classList.add('show');
  const fc=document.getElementById('finale-canvas');
  const fx=fc.getContext('2d');
  fc.width=window.innerWidth; fc.height=window.innerHeight;

  const COLS=['#ff88aa','#ffcc44','#cc88ff','#88ffcc','#ffffff','#ffaadd','#aaccff','#ff99bb','#ffd0ee','#ccffee'];
  const pts=[];
  for(let i=0;i<220;i++){
    pts.push({
      x:Math.random()*fc.width, y:fc.height+Math.random()*fc.height,
      vx:(Math.random()-0.5)*2.2, vy:-(Math.random()*3.8+1.6),
      life:Math.random(), decay:Math.random()*0.006+0.003,
      r:Math.random()*13+4, col:COLS[Math.floor(Math.random()*COLS.length)],
      shape:['heart','star','circle','sparkle'][Math.floor(Math.random()*4)],
      rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.065
    });
  }

  let ft=0;
  function fLoop(){
    fx.clearRect(0,0,fc.width,fc.height); ft++;
    if(ft%2===0){
      for(let i=0;i<5;i++) pts.push({
        x:Math.random()*fc.width, y:fc.height+10,
        vx:(Math.random()-0.5)*2.2, vy:-(Math.random()*3.8+1.6),
        life:1, decay:Math.random()*0.006+0.003,
        r:Math.random()*13+4, col:COLS[Math.floor(Math.random()*COLS.length)],
        shape:['heart','star','circle','sparkle'][Math.floor(Math.random()*4)],
        rot:Math.random()*Math.PI*2, rotV:(Math.random()-0.5)*0.065
      });
    }
    for(let i=pts.length-1;i>=0;i--){
      const p=pts[i];
      p.x+=p.vx; p.y+=p.vy; p.rot+=p.rotV; p.life-=p.decay;
      if(p.life<=0){pts.splice(i,1);continue;}
      const a=Math.max(0,p.life);
      fx.save(); fx.globalAlpha=a; fx.translate(p.x,p.y); fx.rotate(p.rot); fx.fillStyle=p.col;
      if(p.shape==='heart'){
        fx.beginPath(); fx.moveTo(0,-p.r*0.5);
        fx.bezierCurveTo(p.r,-p.r*1.2,p.r*1.5,p.r*0.2,0,p.r);
        fx.bezierCurveTo(-p.r*1.5,p.r*0.2,-p.r,-p.r*1.2,0,-p.r*0.5);
        fx.fill();
      } else if(p.shape==='star'){
        fx.beginPath();
        for(let j=0;j<5;j++){const a2=(j*2*Math.PI/5)-Math.PI/2,b=a2+Math.PI/5;
          fx.lineTo(Math.cos(a2)*p.r,Math.sin(a2)*p.r);
          fx.lineTo(Math.cos(b)*p.r*0.4,Math.sin(b)*p.r*0.4);}
        fx.closePath(); fx.fill();
      } else if(p.shape==='sparkle'){
        for(let j=0;j<4;j++){
          fx.save(); fx.rotate(j*Math.PI/2);
          fx.beginPath(); fx.moveTo(0,-p.r); fx.quadraticCurveTo(p.r*0.22,-p.r*0.22,0,0);
          fx.quadraticCurveTo(-p.r*0.22,-p.r*0.22,0,-p.r); fx.fill(); fx.restore();
        }
      } else { fx.beginPath(); fx.arc(0,0,p.r,0,Math.PI*2); fx.fill(); }
      fx.restore();
    }
    // golden lanterns drifting up
    for(let i=0;i<7;i++){
      const lx=((ft*0.32+i*155)%fc.width);
      const ly2=fc.height-((ft*0.42+i*125)%fc.height)-20;
      const lb=0.5+0.5*Math.sin(ft*0.04+i);
      const lg=fx.createRadialGradient(lx,ly2,0,lx,ly2,42);
      lg.addColorStop(0,`rgba(255,200,80,${0.18+lb*0.12})`);
      lg.addColorStop(1,'rgba(255,200,80,0)');
      fx.fillStyle=lg; fx.beginPath(); fx.arc(lx,ly2,42,0,Math.PI*2); fx.fill();
      fx.fillStyle=`rgba(255,${230+Math.floor(lb*20)},120,${0.5+lb*0.2})`;
      fx.beginPath(); fx.ellipse(lx,ly2,10,14,0,0,Math.PI*2); fx.fill();
    }
    requestAnimationFrame(fLoop);
  }
  fLoop();
}
